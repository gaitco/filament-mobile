name: ci

# Inside the PACKAGE so `git archive HEAD laravel/filament-mobile` carries it
# into the public mirror (`gaitco/filament-mobile`) — see the same note in the
# Flutter package's copy for why CI lives in the mirror rather than the private
# monorepo. Short version: a public repo's Actions minutes are free, and the
# mirror is the tree Packagist actually serves.
on:
  push:
  pull_request:

jobs:
  # This matrix is what replaces the version-adapter layer the spec cut: the
  # package targets two Filament majors, so both get run rather than abstracted.
  #
  # The PHP floor is load-bearing, not decoration. `composer.json` declares
  # `php: ^8.2`, and a feature newer than that is a PARSE error — the file does
  # not load at all, so nothing degrades. A typed constant (`const int X`, which
  # is 8.3) shipped exactly that way in v0.3.0, v0.4.0 and v0.5.0, invisible on a
  # developer machine running 8.4. This job is the only guard against the whole
  # class, which is why it is worth five jobs rather than one.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        filament: ['^4.0', '^5.0']
    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --with="filament/filament:${{ matrix.filament }}" --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest

  # A second driver, not a second Filament version. The pilot found a
  # `LIKE ... ESCAPE '\'` clause that SQLite reads as a literal backslash and
  # MySQL rejects as an unterminated string literal — every search request was
  # a syntax error, and the SQLite-only suite was green throughout. One real
  # MySQL run is what makes that class of bug catchable at all.
  #
  # It also catches the reverse mistake: MySQL's `json` type sorts object keys
  # and re-serialises with a space after each comma, so an assertion that pins
  # SQLite's formatting fails here. `keySorted()` in tests/Pest.php is the
  # answer — never `toEqual()`, which would drop to loose `==` and stop telling
  # `1` from `'1'`.
  test-mysql:
    runs-on: ubuntu-latest
    name: MySQL
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: filament_mobile_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: filament_mobile_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest
